name: Windows Build and Test
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.action != 'closed' && !github.event.pull_request.draft }}
    name: Windows Build and Test
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      PYTHON_VERSION: '3.12'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
              $escapedKey = [regex]::Escape($key)
              $matches = @(Select-String -Path "${{ env.CRAFT_MASTER_CONFIG }}" -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")
              if($matches.Count -ne 1) {
                  throw "Expected exactly one $key value in craftmaster.ini."
              }
              return $matches[0].Matches[0].Groups[1].Value.Trim()
          }

          $craftRevision = configValue "CraftRevision"
          $kdeBlueprintRef = configValue "craft/craft-blueprints-kde.revision"
          $nextcloudBlueprintRef = configValue "craft/craft-blueprints-nextcloud.revision"

          function remoteRevision($repository, $ref) {
              $revision = git ls-remote $repository $ref
              if($LASTEXITCODE -ne 0 -or !$revision) {
                  throw "Could not resolve $ref from $repository."
              }
              return ($revision -split '\s+')[0]
          }

          $kdeBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-kde.git" "refs/heads/$kdeBlueprintRef"
          $nextcloudBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-nextcloud.git" "refs/heads/$nextcloudBlueprintRef"
          @(
              "kde_ref=$kdeBlueprintRef"
              "nextcloud_ref=$nextcloudBlueprintRef"
              "key=$craftRevision-$kdeBlueprintRevision-$nextcloudBlueprintRevision"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Craft Master with Nextcloud Client Deps
        if: steps.craft-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"
          craft craft
          craft --install-deps nextcloud-client
          
      - name: Save Craft dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      #- name: Cache Install inkscape
      #  id: cache-install-inkscape
      #  uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      #  with:
      #    path: C:\Program Files\inkscape
      #    key: ${{ runner.os }}-cache-install-inkscape

      - name: Install inkscape
      #  if: steps.cache-install-inkscape.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install inkscape

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
   
      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --src-dir ${{ github.workspace }} nextcloud-client
          
      - name: Run tests
        shell: pwsh
        run: |
          function runTests() {
              $buildFolder = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build"

              cd $buildFolder

              $binFolder = "$buildFolder\bin"

              & ctest --output-on-failure --timeout 300
          }
          
          runTests

      - name: Install packaging tools
        shell: pwsh
        continue-on-error: true
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c dev-utils/nsis

      - name: Work around a missing import in the client blueprint
        shell: pwsh
        run: |
          # craft-blueprints-nextcloud calls os.path.join in createPackage without
          # importing os, so packaging dies on a NameError before writing anything.
          $bp = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          if(!(Test-Path $bp)) {
              Write-Host "blueprint not found at $bp"
              exit 0
          }
          $text = Get-Content $bp -Raw
          if($text -match '(?m)^import os\s*$') {
              Write-Host "blueprint already imports os"
          } else {
              Set-Content -Path $bp -Value ("import os`r`n" + $text) -NoNewline
              Write-Host "added 'import os' to the blueprint"
          }

      - name: Package installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --src-dir ${{ github.workspace }} --package nextcloud-client

      - name: Collect installer and portable build
        if: always()
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}"
          $out = "${{ github.workspace }}\artifact"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $installer = Get-ChildItem -Path $root -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^nextcloud-.*\.exe$' } |
              Sort-Object Length -Descending | Select-Object -First 1
          if($installer) {
              Copy-Item $installer.FullName $out
              Write-Host "installer: $($installer.FullName)"
          } else {
              Write-Host "no installer matched; contents of $root\tmp:"
              Get-ChildItem -Path "$root\tmp" -Recurse -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length | Format-Table -AutoSize
          }

          # The image directory is the file set the installer would lay down: running
          # nextcloud.exe straight out of it needs no installation and leaves the
          # tester's own client untouched.
          $images = @(Get-ChildItem -Path "$root\build\nextcloud-client" -Directory -Filter "image-*" -ErrorAction SilentlyContinue)
          Write-Host "image directories: $($images.Name -join ', ')"
          # Craft writes the debug symbols into a second image directory suffixed -dbg.
          # That one holds only .pdb files, so the application image is the other one.
          $image = $images | Where-Object { $_.Name -notlike '*-dbg' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if($image) {
              Write-Host "image: $($image.FullName)"
              Compress-Archive -Path "$($image.FullName)\*" -DestinationPath "$out\nextcloud-client-portable.zip" -CompressionLevel Optimal
          } else {
              Write-Host "no image directory found under $root\build\nextcloud-client"
              Get-ChildItem -Path "$root\build\nextcloud-client" -ErrorAction SilentlyContinue |
                  Select-Object Name | Format-Table -AutoSize
          }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("Nextcloud desktop client - unofficial Windows build")
          $lines.Add("")
          $lines.Add("What this is built from")
          $lines.Add("  base branch:   nextcloud/desktop stable-34.0")
          $lines.Add("  base commit:   ecfa626b983545e77f639e13c879742e5923d404")
          $lines.Add("  one patch on top, cherry-picked from 1ecdb7b3063220527259c55e143b72e4f1f165f6:")
          $lines.Add("    fix(discovery): skip the lock check for files in their recorded state")
          $lines.Add("    https://github.com/nextcloud/desktop/pull/10850")
          $lines.Add("  built commit:  ${{ github.event.pull_request.head.sha || github.sha }}")
          $lines.Add("")
          $lines.Add("It is the released 34.0 branch plus that one change, so a measurement against")
          $lines.Add("a 34.0.x baseline moves one variable. It is not built from master.")
          $lines.Add("")
          $lines.Add("Build")
          $lines.Add("  run:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          $lines.Add("  target:  ${{ env.CRAFT_TARGET }}")
          $lines.Add("  date:    $((Get-Date).ToUniversalTime().ToString('u'))")
          $lines.Add("")
          $lines.Add("This build is not signed. Windows SmartScreen will warn about it.")
          $lines.Add("")
          $lines.Add("Two ways to run it")
          $lines.Add("  nextcloud-client-portable.zip - unpack it, quit your own client, run nextcloud.exe")
          $lines.Add("    from the unpacked folder. Nothing is installed, your account and sync folders")
          $lines.Add("    are picked up from the existing configuration, and going back means closing it")
          $lines.Add("    and starting your own client again.")
          if($installer) {
              $lines.Add("  $($installer.Name) - an NSIS installer, for a normal installation. Official")
              $lines.Add("    releases ship as MSI, so this registers separately and is messier to undo.")
          }
          $lines.Add("")
          $lines.Add("SHA-256")
          Get-ChildItem "$out\*" -Include *.exe,*.zip -ErrorAction SilentlyContinue | ForEach-Object {
              $h = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
              $lines.Add("  $h  $($_.Name)")
          }
          $lines | Out-File -FilePath "$out\BUILD-INFO.txt" -Encoding utf8
          Get-Content "$out\BUILD-INFO.txt"

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextcloud-client-stable-34.0-with-pr-10850
          path: artifact/*
          if-no-files-found: error
          overwrite: true
